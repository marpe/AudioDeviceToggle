name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # create releases on tag pushes

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AudioDeviceToggle.slnx

      - name: Test
        run: dotnet test AudioDeviceToggle.slnx -c Release --no-restore

      - name: Publish
        run: |
          $versionArgs = @()
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $versionArgs += "-p:Version=$($env:GITHUB_REF_NAME.TrimStart('v'))"
          }
          dotnet publish AudioDeviceToggle.csproj -c Release --no-restore -o publish @versionArgs

      - uses: actions/upload-artifact@v7
        with:
          name: AudioDeviceToggle-win-x64
          path: publish/AudioDeviceToggle.exe
          if-no-files-found: error

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $prereleaseArgs = @()
          if ($env:GITHUB_REF_NAME.Contains('-')) {
            $prereleaseArgs += '--prerelease'
          }
          gh release create $env:GITHUB_REF_NAME publish/AudioDeviceToggle.exe --verify-tag --generate-notes @prereleaseArgs
